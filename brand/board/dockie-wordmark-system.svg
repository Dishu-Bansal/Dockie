<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 760" width="2400" height="760" role="img" aria-label="Dockie wordmark system board">
  <title>Dockie: Wordmark System, sheet 02</title>
  <desc>1x3 brand strip: primary lockup, wordmark with the beam tick, reversed and monochrome variants.</desc>

  <style>
    .panel { fill: #141619; stroke: #FFFFFF14; }
    .lbl   { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 15px; fill: #6B7076; }
    .pnum  { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 15px; fill: #4A4F55; }
    .foot  { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 14px; fill: #4A4F55; }
    .t     { font-family: 'Geist','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .tm    { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; }
  </style>

  <defs>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <mask id="notch2">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M22 18 L47 43" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="2400" height="760" fill="#0C0D0F"/>
  <g stroke="#FFFFFF" stroke-opacity="0.025">
    <path d="M80 0 V760 M160 0 V760 M240 0 V760 M320 0 V760 M400 0 V760 M480 0 V760 M560 0 V760 M640 0 V760 M720 0 V760 M800 0 V760 M880 0 V760 M960 0 V760 M1040 0 V760 M1120 0 V760 M1200 0 V760 M1280 0 V760 M1360 0 V760 M1440 0 V760 M1520 0 V760 M1600 0 V760 M1680 0 V760 M1760 0 V760 M1840 0 V760 M1920 0 V760 M2000 0 V760 M2080 0 V760 M2160 0 V760 M2240 0 V760 M2320 0 V760"/>
    <path d="M0 80 H2400 M0 160 H2400 M0 240 H2400 M0 320 H2400 M0 400 H2400 M0 480 H2400 M0 560 H2400 M0 640 H2400 M0 720 H2400"/>
  </g>
  <rect width="2400" height="760" filter="url(#grain2)" fill="#FFFFFF" opacity="0.035"/>

  <!-- ============ PANEL 1 · primary lockup ============ -->
  <g>
    <rect x="84" y="100" width="720" height="560" rx="20" class="panel"/>
    <g transform="translate(290,380) scale(4.5) translate(-28,-32)">
      <rect x="10" y="9" width="9" height="46" rx="4.5" fill="#F1EEE7"/>
      <path d="M19 9 A23 23 0 0 1 19 55" fill="none" stroke="#F1EEE7" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 18 L47 43" stroke="#E3A83E" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="430" y="418" class="t" font-size="92" font-weight="700" letter-spacing="-1.8" fill="#F1EEE7">Dockie</text>
    <text x="120" y="632" class="lbl">01 / lockup · primary</text>
    <text x="768" y="632" text-anchor="end" class="pnum">01</text>
  </g>

  <!-- ============ PANEL 2 · wordmark + beam tick ============ -->
  <g>
    <rect x="840" y="100" width="720" height="560" rx="20" class="panel"/>
    <text x="876" y="150" class="tm" font-size="14" fill="#6B7076">wordmark · geist 700 · -2%</text>
    <text x="876" y="300" class="t" font-size="84" font-weight="700" letter-spacing="-1.7" fill="#F1EEE7">Dockie</text>
    <path d="M876 330 H1524" stroke="#FFFFFF12"/>

    <!-- the i, magnified: the dot becomes the beam tick -->
    <text x="876" y="380" class="tm" font-size="14" fill="#6B7076">the dot of the i is the beam</text>
    <rect x="1060" y="440" width="26" height="210" rx="13" fill="#F1EEE7"/>
    <g transform="translate(1140,470) rotate(45)">
      <rect x="-55" y="-13" width="110" height="26" rx="13" fill="#E3A83E"/>
    </g>
    <text x="1200" y="560" class="tm" font-size="14" fill="#9AA0A6">display ≥ 32 px</text>
    <text x="1200" y="584" class="tm" font-size="14" fill="#6B7076">standard dot below that</text>

    <text x="876" y="632" class="lbl">02 / wordmark · the beam tick</text>
    <text x="1524" y="632" text-anchor="end" class="pnum">02</text>
  </g>

  <!-- ============ PANEL 3 · reversed + monochrome ============ -->
  <g>
    <rect x="1596" y="100" width="720" height="560" rx="20" class="panel"/>
    <text x="1632" y="150" class="tm" font-size="14" fill="#6B7076">reversed · on paper</text>

    <!-- reversed lockup on paper card -->
    <rect x="1632" y="180" width="648" height="170" rx="16" fill="#F1EEE7"/>
    <g transform="translate(1712,265) scale(2.6) translate(-28,-32)">
      <rect x="10" y="9" width="9" height="46" rx="4.5" fill="#0C0D0F"/>
      <path d="M19 9 A23 23 0 0 1 19 55" fill="none" stroke="#0C0D0F" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 18 L47 43" stroke="#E3A83E" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="1840" y="288" class="t" font-size="52" font-weight="700" letter-spacing="-1" fill="#0C0D0F">Dockie</text>

    <path d="M1632 390 H2244" stroke="#FFFFFF12"/>
    <text x="1632" y="424" class="tm" font-size="14" fill="#6B7076">monochrome · one color, beam as cut</text>

    <!-- mono mark -->
    <g transform="translate(1690,540) scale(3) translate(-28,-32)" mask="url(#notch2)">
      <g fill="#F1EEE7">
        <rect x="10" y="9" width="9" height="46" rx="4.5"/>
        <path d="M19 9 A23 23 0 0 1 19 55" fill="none" stroke="#F1EEE7" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
    <!-- mono lockup -->
    <g transform="translate(1800,540) scale(2.2) translate(-28,-32)" mask="url(#notch2)">
      <g fill="#F1EEE7">
        <rect x="10" y="9" width="9" height="46" rx="4.5"/>
        <path d="M19 9 A23 23 0 0 1 19 55" fill="none" stroke="#F1EEE7" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
    <text x="1850" y="556" class="t" font-size="40" font-weight="700" letter-spacing="-0.8" fill="#F1EEE7">Dockie</text>
    <!-- tray -->
    <g transform="translate(2090,516) scale(3)">
      <rect x="3" y="2.5" width="3" height="11" rx="1.5" fill="#F1EEE7"/>
      <path d="M6 2.5 A5.5 5.5 0 0 1 6 13.5" fill="none" stroke="#F1EEE7" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="2090" y="588" text-anchor="middle" class="tm" font-size="12" fill="#6B7076">tray</text>

    <text x="1632" y="632" class="lbl">03 / variants · reversed + mono</text>
    <text x="2280" y="632" text-anchor="end" class="pnum">03</text>
  </g>

  <!-- footer -->
  <path d="M84 672 H2316" stroke="#FFFFFF14"/>
  <text x="84" y="700" class="foot">DOCKIE / BRAND IDENTITY SYSTEM</text>
  <text x="2316" y="700" text-anchor="end" class="foot">SHEET 02 / 02</text>
</svg>

      <circle cx="19" cy="32" r="2" fill="#E3A83E"/>
      <text x="26" y="27" class="tm" font-size="9" fill="#6B7076">C (19,32)</text>
      <text x="28" y="25" class="tm" font-size="10" fill="#9AA0A6">R 23</text>
      <text x="11" y="76" class="tm" font-size="10" fill="#9AA0A6">9</text>
      <text x="33" y="14" class="tm" font-size="10" fill="#9AA0A6">45°</text>
      <text x="50" y="56" class="tm" font-size="9" fill="#6B7076">the ray</text>
    </g>
    <text x="876" y="476" class="lbl">02 / construction · 45° beam</text>
    <text x="1524" y="476" text-anchor="end" class="pnum">02</text>
  </g>


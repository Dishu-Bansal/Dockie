    <rect x="1670" y="248" width="572" height="70" rx="10" fill="#E3A83E14"/>
    <rect x="1692" y="270" width="14" height="18" rx="2" fill="none" stroke="#E3A83E" stroke-width="2"/>
    <text x="1720" y="284" class="t" font-size="14" font-weight="500" fill="#F1EEE7">2025-03-invoice.pdf</text>
    <text x="1720" y="302" class="tm" font-size="10.5" fill="#6B7076">C:\Users\mara\Invoices</text>
    <text x="1720" y="320" class="tm" font-size="10.5" fill="#9AA0A6">The March <tspan fill="#E3A83E">invoice</tspan> for the audit file, net 30 days.</text>

    <!-- result 2 -->
    <rect x="1670" y="326" width="572" height="70" rx="10" fill="#FFFFFF06"/>
    <rect x="1692" y="348" width="14" height="18" rx="2" fill="none" stroke="#9AA0A6" stroke-width="2"/>
    <text x="1720" y="362" class="t" font-size="14" font-weight="500" fill="#9AA0A6">vendor-agreement.pdf</text>
    <text x="1720" y="380" class="tm" font-size="10.5" fill="#6B7076">C:\Users\mara\Contracts</text>
    <text x="1720" y="398" class="tm" font-size="10.5" fill="#9AA0A6">The second <tspan fill="#E3A83E">invoice</tspan> is due on receipt, Q2 retainer.</text>

    <!-- key hints -->
    <g>
      <rect x="1676" y="408" width="44" height="24" rx="5" fill="#FFFFFF0D" stroke="#FFFFFF26"/>
      <text x="1698" y="424" text-anchor="middle" class="tm" font-size="11" fill="#F1EEE7">↑↓</text>
      <rect x="1728" y="408" width="58" height="24" rx="5" fill="#FFFFFF0D" stroke="#FFFFFF26"/>
      <text x="1757" y="424" text-anchor="middle" class="tm" font-size="11" fill="#F1EEE7">Enter</text>
      <rect x="1794" y="408" width="46" height="24" rx="5" fill="#FFFFFF0D" stroke="#FFFFFF26"/>
      <text x="1817" y="424" text-anchor="middle" class="tm" font-size="11" fill="#F1EEE7">Esc</text>
      <text x="2242" y="424" text-anchor="end" class="tm" font-size="11" fill="#6B7076">3 matches</text>
    </g>

    <text x="1632" y="476" class="lbl">03 / ui · search overlay</text>
    <text x="2280" y="476" text-anchor="end" class="pnum">03</text>
  </g>

  <!-- ============ PANEL 4 · essence ============ -->
  <g>
    <rect x="84" y="540" width="720" height="420" rx="20" class="panel"/>
    <text x="444" y="706" text-anchor="middle" class="t" font-size="56" font-weight="600" letter-spacing="-1.1" fill="#F1EEE7">Every document,</text>
    <text x="444" y="776" text-anchor="middle" class="t" font-size="56" font-weight="600" letter-spacing="-1.1" fill="#E3A83E">one beam away.</text>
    <text x="120" y="932" class="lbl">04 / essence · tagline</text>
    <text x="768" y="932" text-anchor="end" class="pnum">04</text>
  </g>


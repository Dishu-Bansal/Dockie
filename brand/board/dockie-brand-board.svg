    <text x="1414" y="722" text-anchor="middle" class="tm" font-size="13" fill="#0C0D0F">E3A83E · beam</text>
    <!-- row 2 -->
    <rect x="876" y="736" width="196" height="84" rx="12" fill="#15171B" stroke="#FFFFFF26"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" width="2400" height="1500" role="img" aria-label="Dockie brand identity system board">
  <title>Dockie: Brand Identity System, sheet 01</title>
  <desc>3x3 brand-kit board: logo, construction, UI application, essence, color, type, icons, image direction, system details.</desc>

  <style>
    .panel   { fill: #141619; stroke: #FFFFFF14; }
    .lbl     { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 15px; fill: #6B7076; }
    .pnum    { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 15px; fill: #4A4F55; }
    .foot    { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; font-size: 14px; fill: #4A4F55; }
    .t       { font-family: 'Geist','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .tm      { font-family: 'Geist Mono','Cascadia Mono',Consolas,monospace; }
  </style>

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <radialGradient id="glow-app" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#E3A83E" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#E3A83E" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E3A83E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scene-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0D0F"/>
      <stop offset="0.62" stop-color="#14100A"/>
      <stop offset="1" stop-color="#1C1307"/>
    </linearGradient>

    <linearGradient id="scene-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3A83E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E3A83E" stop-opacity="0"/>
    </linearGradient>

    <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#E3A83E" fill-opacity="0.14"/>
    </pattern>

    <clipPath id="clip-p8">
      <rect x="840" y="996" width="720" height="420" rx="20"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="2400" height="1500" fill="#0C0D0F"/>
  <g stroke="#FFFFFF" stroke-opacity="0.025">
    <path d="M80 0 V1500 M160 0 V1500 M240 0 V1500 M320 0 V1500 M400 0 V1500 M480 0 V1500 M560 0 V1500 M640 0 V1500 M720 0 V1500 M800 0 V1500 M880 0 V1500 M960 0 V1500 M1040 0 V1500 M1120 0 V1500 M1200 0 V1500 M1280 0 V1500 M1360 0 V1500 M1440 0 V1500 M1520 0 V1500 M1600 0 V1500 M1680 0 V1500 M1760 0 V1500 M1840 0 V1500 M1920 0 V1500 M2000 0 V1500 M2080 0 V1500 M2160 0 V1500 M2240 0 V1500 M2320 0 V1500"/>
    <path d="M0 80 H2400 M0 160 H2400 M0 240 H2400 M0 320 H2400 M0 400 H2400 M0 480 H2400 M0 560 H2400 M0 640 H2400 M0 720 H2400 M0 800 H2400 M0 880 H2400 M0 960 H2400 M0 1040 H2400 M0 1120 H2400 M0 1200 H2400 M0 1280 H2400 M0 1360 H2400 M0 1440 H2400"/>
  </g>
  <rect width="2400" height="1500" filter="url(#grain)" fill="#FFFFFF" opacity="0.035"/>

  <!-- ============ PANEL 1 · logo cover ============ -->
  <g>
    <rect x="84" y="84" width="720" height="420" rx="20" class="panel"/>
    <g transform="translate(444,280) scale(4.5) translate(-28,-32)">
      <rect x="10" y="9" width="9" height="46" rx="4.5" fill="#F1EEE7"/>
      <path d="M19 9 A23 23 0 0 1 19 55" fill="none" stroke="#F1EEE7" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 18 L47 43" stroke="#E3A83E" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="444" y="428" text-anchor="middle" class="t" font-size="54" font-weight="700" letter-spacing="-1.1" fill="#F1EEE7">Dockie</text>
    <text x="120" y="476" class="lbl">01 / logo · primary</text>
    <text x="768" y="476" text-anchor="end" class="pnum">01</text>
  </g>


    <rect x="1096" y="736" width="196" height="84" rx="12" fill="#9AA0A6"/>
    <text x="1194" y="854" text-anchor="middle" class="tm" font-size="13" fill="#0C0D0F">9AA0A6 · smoke</text>
    <rect x="1316" y="736" width="196" height="84" rx="12" fill="#B45518"/>
    <text x="1414" y="854" text-anchor="middle" class="tm" font-size="13" fill="#F1EEE7">B45518 · ember</text>
    <text x="876" y="932" class="lbl">05 / color · one accent family</text>
    <text x="1524" y="932" text-anchor="end" class="pnum">05</text>
  </g>


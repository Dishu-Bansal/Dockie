      <g stroke="#6B7076" stroke-width="1" stroke-dasharray="4 4" fill="none">
        <circle cx="19" cy="32" r="23"/>
        <path d="M14 10 L55 51"/>
        <path d="M19 32 L42 32"/>
        <circle cx="45" cy="41" r="5"/>
      </g>
      <g stroke="#9AA0A6" stroke-width="1.4" fill="none">
        <path d="M17 32 H21 M19 30 V34"/>
        <path d="M10 62 H19"/>
        <path d="M10 60 V64 M19 60 V64"/>
        <path d="M28.1 22.3 A10 10 0 0 0 26.5 12.3"/>

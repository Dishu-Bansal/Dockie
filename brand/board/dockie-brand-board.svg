    <rect x="1596" y="540" width="720" height="420" rx="20" class="panel"/>
    <text x="1636" y="668" class="t" font-size="96" font-weight="700" letter-spacing="-1.9" fill="#F1EEE7">Dockie</text>
    <text x="2280" y="648" text-anchor="end" class="tm" font-size="13" fill="#6B7076">Geist 700 · -2%</text>

# Deploys the Dockie landing page (landing/) to GitHub Pages.
#
# One-time repo setup (cannot be done from a workflow):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The site then lives at https://<owner>.github.io/Dockie/ (project page,
# served from the /Dockie/ subpath). The Vite build already uses a relative
# base (base: "./"), so all asset URLs resolve correctly under the subpath.

name: Deploy landing page to GitHub Pages

"on":
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
